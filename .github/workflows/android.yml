name: Build LiveTrans TR-AR APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livetrans-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore compressed Android source
        shell: bash
        run: |
          set -euo pipefail
          cat source-b64/* | tr -d '[:space:]' | base64 --decode > /tmp/livetrans-source.zip
          unzip -q /tmp/livetrans-source.zip -d restored
          test -f restored/LiveTransTRAR/settings.gradle.kts
          test -f restored/LiveTransTRAR/app/build.gradle.kts

      - name: Download sherpa-onnx Android library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restored/LiveTransTRAR/app/libs
          curl --fail --location --retry 3 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar \
            --output restored/LiveTransTRAR/app/libs/sherpa-onnx-2.0.1.aar
          echo 'a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  restored/LiveTransTRAR/app/libs/sherpa-onnx-2.0.1.aar' | sha256sum --check

      - name: Build debug APK
        shell: bash
        run: |
          cd restored/LiveTransTRAR
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveTrans-TR-AR-APK
          path: restored/LiveTransTRAR/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
